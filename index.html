  <script>
    (function () {
      var T = 100, N = 10;
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = T * N;
      var ctx = canvas.getContext('2d');
      var nr = new Image(), ni = new Image(), done = 0;
      function draw() {
        if (++done < 2) return;
        for (var r = 0; r < N; r++)
          for (var c = 0; c < N; c++)
            ctx.drawImage(Math.random() < 0.05 ? ni : nr, c * T, r * T, T, T);
        var el = document.querySelector('.nether-floor');
        if (el) {
          el.style.backgroundImage = 'url(' + canvas.toDataURL() + ')';
          el.style.backgroundSize = (T * N) + 'px ' + (T * N) + 'px';
        }
      }
      nr.onload = ni.onload = draw;
      nr.src = 'netherrock.png';
      ni.src = 'netherite.png';
    })();
  </script>
